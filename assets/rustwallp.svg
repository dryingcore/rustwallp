<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#16181e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5c5c"/>
      <stop offset="1" stop-color="#2fc6c6"/>
    </linearGradient>
  </defs>

  <!-- janela -->
  <rect x="6" y="10" width="116" height="108" rx="16" fill="url(#bg)"/>
  <rect x="6.5" y="10.5" width="115" height="107" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- tela com o wallpaper: céu, sol e montanhas -->
  <rect x="16" y="22" width="96" height="62" rx="6" fill="url(#sky)"/>
  <circle cx="88" cy="40" r="8" fill="#ffc56b"/>
  <path d="M16 72 L42 46 L60 62 L76 50 L112 80 L112 78 a6 6 0 0 1 -6 6 H22 a6 6 0 0 1 -6 -6 Z" fill="#16181e" fill-opacity=".85"/>

  <!-- a barra da polybar no topo da tela -->
  <rect x="16" y="22" width="96" height="6" rx="3" fill="#000000"/>
  <rect x="20" y="24" width="6" height="2" rx="1" fill="#2fc6c6"/>
  <rect x="80" y="24" width="28" height="2" rx="1" fill="#00cc00"/>

  <!-- galeria embaixo -->
  <rect x="16" y="92" width="28" height="16" rx="3" fill="#7aa2f7"/>
  <rect x="50" y="92" width="28" height="16" rx="3" fill="#f08a24"/>
  <rect x="84" y="92" width="28" height="16" rx="3" fill="#2fc6c6"/>
  <rect x="84" y="92" width="28" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
