name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: formatação, clippy e testes
    # ubuntu 22.04 (glibc 2.35): o binário roda no Debian 12 (2.36) e no 13
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        # libgtk-3-dev: seletor de arquivo (rfd); o resto do X11/teclado/GPU é
        # carregado em tempo de execução e não precisa estar aqui
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testes
        # os testes marcados com #[ignore] precisam da sessão real (X11, i3,
        # polybar, ~/Wallpapers) e não rodam aqui
        run: cargo test --locked

      - name: Pacote .deb
        run: packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rustwallp-deb
          path: dist/*.deb

  release:
    name: publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rustwallp-deb
          path: dist

      - name: Criar a versão no GitHub com o .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "rustwallp $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
